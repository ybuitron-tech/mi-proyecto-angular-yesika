<main class="dashboard">

  <h2>📊 Dashboard Inteligente</h2>

  <button class="btn" (click)="toggleDashboard()">
    {{ mostrar ? '🔽 Ocultar Panel' : '📊 Ver Panel' }}
  </button>

  <div *ngIf="mostrar">

    <div class="cards">

      <div class="card">
        <h3>👥 Estudiantes</h3>
        <p>{{ estudiantes.length }}</p>
      </div>

      <div class="card">
        <h3>📈 Promedio</h3>
        <p>{{ getPromedio() }}</p>
      </div>

      <div class="card green">
        <h3>✅ Aprobados</h3>
        <p>{{ getAprobados() }}</p>
      </div>

      <div class="card red">
        <h3>⚠️ En riesgo</h3>
        <p>{{ getEnRiesgo() }}</p>
      </div>

    </div>

    <div class="ia">
      <h3>🧠 Análisis IA</h3>
      <p>{{ analisisIA() }}</p>
    </div>

  </div>

</main>
